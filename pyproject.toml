[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlandex-agent"
version = "0.1.0"
description = "LangGraph agent and evaluation harness over the Atlandex MCP server, run through OpenRouter"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-mcp-adapters>=0.3",
  "mcp>=1.20",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional Langfuse tracing; the agent runs without it. The LangChain handler imports `langchain` itself.
tracing = ["langfuse>=4,<5", "langchain>=1.0"]

[tool.setuptools.packages.find]
include = ["atlandex_agent*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
